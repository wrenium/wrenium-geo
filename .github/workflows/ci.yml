name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  library-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
          - os: macos-latest
            cc: clang
            cxx: clang++
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -S . -B build
          else
            cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          fi

      - name: Build tests
        run: cmake --build build --target tests --config Release

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -C Release -R '^tests$'

  sanitizers:
    # ASan+UBSan on the test suite -- catches memory-safety/UB bugs the
    # plain library-tests job can't. These flags are set here at the CI
    # invocation level only, never in the project's own CMakeLists.txt --
    # compiler flags are the consuming project's choice, not this
    # library's, same as every other build-flag finding this project has
    # deliberately kept out of its own build config.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (ASan+UBSan)
        run: |
          cmake -S . -B build \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build tests
        run: cmake --build build --target tests

      - name: Run tests under sanitizers
        run: ctest --test-dir build --output-on-failure -R '^tests$'

  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build converter + its tests
        run: cmake --build build --target topojson2bin topojson2bin_tests

      - name: Run converter tests
        run: ctest --test-dir build --output-on-failure -R topojson2bin_tests

  qt-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"

      - name: Configure
        run: cmake -S . -B build

      - name: Build Qt apps
        run: cmake --build build --target examples demos

  embed-as-dependency:
    # Verifies that embedding the library via add_subdirectory (the way a
    # consumer would) never touches Qt or fetches nlohmann/json -- only the
    # header-only INTERFACE target should exist in that scenario.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: wrenium-geo

      - name: Create a minimal consumer project
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.21)
          project(EmbedTest LANGUAGES CXX)
          add_subdirectory(../wrenium-geo wrenium_geo_build)
          add_executable(uses_wrenium_geo main.cpp)
          target_link_libraries(uses_wrenium_geo PRIVATE Wrenium::geo)
          EOF
          cat > consumer/main.cpp <<'EOF'
          #include <wrenium/geo/azimuthal_pipeline.h>
          int main() { return 0; }
          EOF

      - name: Configure and build (must not require Qt or network)
        run: |
          cmake -S consumer -B consumer/build
          cmake --build consumer/build

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: pip install --break-system-packages clang-format

      - name: Check formatting
        run: |
          files=$(find . -name "*.h" -o -name "*.cpp")
          clang-format --dry-run --Werror $files

  static-analysis:
    # bugprone-*/cert-* only -- see .clang-tidy's own comment for why the
    # broader cppcoreguidelines-*/performance-*/portability-* sets aren't
    # used here (mostly conflict with this library's deliberate design).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy
        run: pip install --break-system-packages clang-tidy

      - name: Configure (with compile_commands.json)
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build tests (generates all headers clang-tidy needs)
        run: cmake --build build --target tests

      - name: Run clang-tidy
        run: |
          files=$(find tests -name "*.cpp")
          clang-tidy -p build $files

  reuse:
    # Enforces REUSE Specification (https://reuse.software/) compliance --
    # every tracked file must have clear copyright/license info, either an
    # inline SPDX tag or a REUSE.toml entry.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install reuse
        run: pip install --break-system-packages reuse

      - name: Check REUSE compliance
        run: reuse lint

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Build API docs (fail on any warning)
        run: doxygen Doxyfile 2>&1 | tee doxygen.log && ! grep -q "warning:" doxygen.log

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/api/html

  deploy-docs:
    needs: docs
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
